<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: 'Consolas', monospace;
      width: 58mm;
      margin: 0;
      padding: 10px;
      font-size: 12px;
    }
    .title {
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }
    .line { border-top: 1px dashed #000; margin: 8px 0; }
    .total { text-align: right; font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="title">Cumbre Libros</div>
  <div>Consumidor Final</div>
  <div>Fecha: {{Date}}</div>
  <div class="line"></div>
  <div>
    {{Items}}
  </div>
  <div class="line"></div>
  <div class="total">TOTAL: ${{Total}}</div>
</body>
</html>
